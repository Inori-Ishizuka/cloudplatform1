<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <title>商品編集</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background-color: #f4f6fb;
        }


        .navbar {
            background-color: #6f42c1;
        }


        .card {
            border: none;
            border-radius: 20px;
        }


        .btn {
            border-radius: 10px;
        }


        h2 {
            color: #6f42c1;
            font-weight: bold;
        }

    </style>


</head>


<body>



<!-- ヘッダー -->

<nav class="navbar navbar-dark">

    <div class="container">


        <span class="navbar-brand fs-3">

            📦 在庫管理システム

        </span>



        <a href="/" class="btn btn-light">

            <i class="bi bi-house-fill"></i>

            ホーム

        </a>


    </div>

</nav>




<!-- メイン -->

<div class="container mt-5">


    <div class="row justify-content-center">


        <div class="col-md-7">



            <div class="card shadow p-4">



                <h2 class="text-center mb-4">

                    <i class="bi bi-pencil-square"></i>

                    商品編集

                </h2>




                <form method="POST">



                    <div class="mb-3">


                        <label class="form-label">

                            商品名

                        </label>


                        <input

                            type="text"

                            name="name"

                            value="{{ product.name }}"

                            class="form-control"

                            required>


                    </div>




                    <div class="mb-3">


                        <label class="form-label">

                            価格

                        </label>



                        <input

                            type="number"

                            name="price"

                            value="{{ product.price }}"

                            class="form-control"

                            required>


                    </div>




                    <div class="mb-3">


                        <label class="form-label">

                            カテゴリ

                        </label>



                        <input

                            type="text"

                            name="category"

                            value="{{ product.category }}"

                            class="form-control">


                    </div>




                    <div class="mb-4">


                        <label class="form-label">

                            在庫数

                        </label>



                        <input

                            type="number"

                            name="stock"

                            value="{{ product.stock }}"

                            class="form-control"

                            required>


                    </div>





                    <div class="d-grid gap-2">



                        <button

                            type="submit"

                            class="btn btn-primary btn-lg">


                            <i class="bi bi-check-circle"></i>

                            更新



                        </button>




                        <a

                            href="/products"

                            class="btn btn-secondary">


                            <i class="bi bi-arrow-left"></i>

                            商品一覧へ戻る



                        </a>



                    </div>



                </form>



            </div>



        </div>


    </div>



</div>



</body>

</html>
