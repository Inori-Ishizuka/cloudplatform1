<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>在庫管理システム</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f4f6fb;
        }

        .navbar {
            background-color: #6f42c1;
        }

        .card {
            border: none;
            border-radius: 20px;
            transition: 0.3s;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .icon {
            font-size: 55px;
            color: #6f42c1;
            margin-bottom: 15px;
        }

        .btn {
            border-radius: 10px;
        }

        .welcome-card {
            border-radius: 20px;
        }
    </style>

</head>

<body>

    <!-- ヘッダー -->
    <nav class="navbar navbar-dark">
        <div class="container">

            <span class="navbar-brand fs-3">
                📦 在庫管理システム
            </span>

            <a href="/" class="btn btn-light">
                <i class="bi bi-house-fill"></i>
                ホーム
            </a>

        </div>
    </nav>

    <div class="container mt-5">

        <!-- ようこそ -->
        <div class="card shadow welcome-card p-4 mb-4">

            <h2>ようこそ！</h2>

            <p class="text-muted mb-3">
                商品の登録・在庫管理・入庫・出庫・履歴管理を行えます。
            </p>

            <!-- 検索 -->
            <form action="/products" method="GET">

                <div class="row">

                    <div class="col-md-9">

                        <input
                            type="text"
                            name="keyword"
                            class="form-control form-control-lg"
                            placeholder="🔍 商品名を検索">

                    </div>

                    <div class="col-md-3">

                        <button class="btn btn-primary btn-lg w-100">
                            検索
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- メニュー -->
        <div class="row g-4">

            <!-- 商品管理 -->
            <div class="col-lg-3 col-md-6">

                <div class="card shadow text-center p-4">

                    <div class="icon">
                        <i class="bi bi-box-seam"></i>
                    </div>

                    <h4>商品管理</h4>

                    <p class="text-muted">
                        商品の一覧表示・管理
                    </p>

                    <a href="/products" class="btn btn-primary w-100 mb-2">
                        商品一覧
                    </a>

                    <a href="/add" class="btn btn-info w-100">
                        新規登録
                    </a>

                </div>

            </div>

            <!-- 入庫 -->
            <div class="col-lg-3 col-md-6">

                <div class="card shadow text-center p-4">

                    <div class="icon">
                        <i class="bi bi-box-arrow-in-down"></i>
                    </div>

                    <h4>入庫</h4>

                    <p class="text-muted">
                        商品を選択して入庫
                    </p>

                    <a href="/products" class="btn btn-success w-100">
                        入庫へ
                    </a>

                </div>

            </div>

            <!-- 出庫 -->
            <div class="col-lg-3 col-md-6">

                <div class="card shadow text-center p-4">

                    <div class="icon">
                        <i class="bi bi-box-arrow-up"></i>
                    </div>

                    <h4>出庫</h4>

                    <p class="text-muted">
                        商品を選択して出庫
                    </p>

                    <a href="/products" class="btn btn-warning w-100">
                        出庫へ
                    </a>

                </div>

            </div>

            <!-- 履歴 -->
            <div class="col-lg-3 col-md-6">

                <div class="card shadow text-center p-4">

                    <div class="icon">
                        <i class="bi bi-clock-history"></i>
                    </div>

                    <h4>履歴</h4>

                    <p class="text-muted">
                        入出庫履歴を確認
                    </p>

                    <a href="/history" class="btn btn-secondary w-100">
                        履歴を見る
                    </a>

                </div>

            </div>

            <!-- 在庫状況 -->
            <div class="col-lg-3 col-md-6">

                <div class="card shadow text-center p-4">

                    <div class="icon">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>

                    <h4>在庫状況</h4>

                    <div class="alert alert-danger">

                        <i class="bi bi-exclamation-triangle-fill"></i>

                        在庫不足商品

                        <hr>

                        <h3 class="mb-0">
                            {{ low_stock_count }} 件
                        </h3>

                    </div>

                    <a href="/low_stock" class="btn btn-danger w-100">
                        在庫確認
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
